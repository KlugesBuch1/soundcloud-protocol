[package]
name = "soundcloud-v2"
version = "0.1.1"
edition = "2021"
description = "Read-only client for the SoundCloud api-v2 routes in the catalogue"
license = "MIT"
repository = "https://github.com/KlugesBuch1/soundcloud-protocol"
readme = "README.md"
keywords = ["soundcloud", "api", "http", "client", "catalogue"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
